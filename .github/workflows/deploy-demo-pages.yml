name: Publicar demo en GitHub Pages

# Manual: publishing is a separate step after Render is ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Warehouse/frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Instalar dependencias
        working-directory: Warehouse/frontend
        run: npm ci
      - name: Configurar API pública
        working-directory: Warehouse/frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/configure-demo-api.cjs
      - name: Compilar para el repositorio
        working-directory: Warehouse/frontend
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base-href "/${REPOSITORY_NAME}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Warehouse/frontend/dist/frontend/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
