<div class="container">
  <div class="header">
    <h1>Lotes</h1>
    <button class="btn btn-primary" (click)="onCreate()">
      + Nuevo Lote
    </button>
  </div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div *ngIf="loading" class="loading">Cargando...</div>

  <div *ngIf="!loading && lotes.length === 0" class="empty-state">
    No hay lotes registrados
  </div>

  <table *ngIf="!loading && lotes.length > 0" class="table catalog-table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Fecha Vencimiento</th>
        <th class="status-cell">Estado</th>
        <th class="actions-cell">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let lote of lotes">
        <td>{{ lote.codigo }}</td>
        <td>{{ formatDate(lote.fechaVencimiento) }}</td>
        <td class="status-cell"><span class="record-status" [class.is-active]="lote.activo" [class.is-inactive]="!lote.activo">
            {{ lote.activo ? 'Activo' : 'Inactivo' }}
          </span></td>
        <td class="actions-cell"><div class="record-actions"><button class="record-action record-edit" (click)="onEdit(lote.id)">
            Editar
          </button>
              <button type="button" class="record-action record-delete" (click)="onDelete(lote.id)" [disabled]="deletingId !== null" [attr.aria-label]="'Eliminar ' + lote.codigo">
                {{ deletingId === lote.id ? 'Eliminando…' : 'Eliminar' }}
              </button>
          
        </div></td>
      </tr>
    </tbody>
  </table>
</div>
<app-delete-dialog></app-delete-dialog>
