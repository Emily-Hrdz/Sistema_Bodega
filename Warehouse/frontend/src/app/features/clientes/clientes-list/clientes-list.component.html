<div class="container">
  <div class="header">
    <h1>Clientes</h1>
    <button class="btn btn-primary" (click)="onCreate()">
      + Nuevo Cliente
    </button>
  </div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div *ngIf="loading" class="loading">Cargando...</div>

  <div *ngIf="!loading && clientes.length === 0" class="empty-state">
    No hay clientes registrados
  </div>

  <table *ngIf="!loading && clientes.length > 0" class="table catalog-table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th class="status-cell">Estado</th>
        <th class="actions-cell">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.codigo }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.email || '-' }}</td>
        <td>{{ cliente.telefono || '-' }}</td>
        <td class="status-cell"><span class="record-status" [class.is-active]="cliente.activo" [class.is-inactive]="!cliente.activo">
            {{ cliente.activo ? 'Activo' : 'Inactivo' }}
          </span></td>
        <td class="actions-cell"><div class="record-actions"><button class="record-action record-edit" (click)="onEdit(cliente.id)">
            Editar
          </button>
              <button type="button" class="record-action record-delete" (click)="onDelete(cliente.id)" [disabled]="deletingId !== null" [attr.aria-label]="'Eliminar ' + cliente.codigo">
                {{ deletingId === cliente.id ? 'Eliminando…' : 'Eliminar' }}
              </button>
        
        </div></td>
      </tr>
    </tbody>
  </table>
</div>
<app-delete-dialog></app-delete-dialog>
